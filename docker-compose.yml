services:
  # 🚀 Smart ERP Backend
  smart-erp-backend:
    build: ./erp-backend
    container_name: smart-erp-backend
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  # 🚀 Smart ERP Frontend
  smart-erp-frontend:
    build: ./erp-frontend
    container_name: smart-erp-frontend
    ports:
      - "80:80"  # 💡 최신 도커로 포트 80 탈환
    depends_on:
      - smart-erp-backend
    restart: always
