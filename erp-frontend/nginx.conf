server {
    listen 80;
    server_name localhost;

    # 1. 프론트엔드 정적 파일 서빙
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. 🚀 [핵심] 모든 /api 요청을 백엔드로 전달
    # backend 컨테이너가 /api context-path를 가지고 있으므로 경로를 자르지 않고 그대로 보냅니다.
    location /api {
        proxy_pass http://smart-erp-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 타임아웃 확장 (대용량 업로드/조회 대비)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 3. 이미지 리소스 경로 지원
    location /Upload_Images {
        proxy_pass http://smart-erp-backend:8080/api/Upload_Images;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
