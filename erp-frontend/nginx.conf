server {
    listen 80;
    server_name localhost;

    # 1. 프론트엔드 정적 파일 서빙
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. 🚀 [404 완전 해결] 모든 /api 요청을 백엔드로 무조건 전달
    # 슬래시(/) 처리를 가장 유연하게 하여 경로 미스매치를 차단합니다.
    location /api {
        proxy_pass http://smart-erp-backend:8080/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 브라우저 캐시 방지 (최신 데이터 보장)
        add_header Last-Modified $date_gmt;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        if_modified_since off;
        expires off;
        etag off;
    }

    # 3. 이미지 리소스 경로 지원
    location /Upload_Images {
        proxy_pass http://smart-erp-backend:8080/api/Upload_Images;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
